name: Daily Dashboard Update

on:
  schedule:
    - cron: '0 14 * * *'  # 6:00 AM PT daily
  workflow_dispatch:       # Run manually from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install certifi
        run: pip3 install certifi

      - name: Fetch news and update dashboard
        run: python3 update_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "bot@daily-dashboard.local"
          git add index.html
          git diff --staged --quiet || git commit -m "Daily update $(date -u '+%Y-%m-%d')"
          git push

      - name: Deploy to Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: team_ikZ4KVtrThFLQHt8U27UjG5s
          VERCEL_PROJECT_ID: prj_ZWb8ep6AhDVvjHXPcA5JASPzzKjb
